name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos minimos a nivel global: el job que ejecuta codigo de terceros
# (dependencias npm) solo necesita leer el repositorio.
permissions:
  contents: read

concurrency:
  # Un despliegue a la vez por rama; en PRs se cancelan las corridas obsoletas,
  # pero nunca se cancela un deploy a Pages en curso.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Una unica instalacion de dependencias para tests y build.
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      # Si un test falla, el job termina aqui: no se sube artefacto y deploy se omite.
      - name: Unit tests
        working-directory: apps/web
        run: npm test -- --watch=false
      - name: Build
        working-directory: apps/web
        run: npm run build -- --base-href "/${GITHUB_REPOSITORY#*/}/"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist/web/browser

  deploy:
    name: Deploy a GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Permisos de escritura acotados unicamente al job de despliegue.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
