<div class="login-page">
  <app-language-selector />
  <div class="login-brand">
    <img src="soter-hseq-login.png" alt="SOTER HSEQ — Salud y Seguridad en el Trabajo" />
    <p class="login-tagline">{{ 'auth.brandTagline' | transloco }}</p>
  </div>

  <form class="login-card" (submit)="onSubmit(); $event.preventDefault()">
    <div class="login-card-header">
      <h2>{{ 'auth.login.title' | transloco }}</h2>
      <p class="subtitle">{{ 'auth.login.subtitle' | transloco }}</p>
    </div>

    <label>
      {{ 'auth.login.email' | transloco }}
      <input type="email" [formField]="loginForm.email" autocomplete="username" />
      @if (loginForm.email().touched() && loginForm.email().errors().length) {
        <span class="field-error">{{ loginForm.email().errors()[0].message | transloco }}</span>
      }
    </label>

    <label>
      {{ 'auth.login.password' | transloco }}
      <input type="password" [formField]="loginForm.password" autocomplete="current-password" />
      @if (loginForm.password().touched() && loginForm.password().errors().length) {
        <span class="field-error">{{ loginForm.password().errors()[0].message | transloco }}</span>
      }
    </label>

    @if (authError()) {
      <p class="form-error">{{ authError()! | transloco }}</p>
    }

    <button type="submit" [disabled]="loginForm().invalid() || loading()">
      {{ (loading() ? 'auth.login.submitting' : 'auth.login.submit') | transloco }}
    </button>

    <a routerLink="/recuperar-contrasena" class="forgot-link">{{ 'auth.login.forgot' | transloco }}</a>
  </form>

  <p class="login-footer">SOTER HSEQ · administracion&#64;soterhseq.com · Cobertura Nacional, Colombia</p>
</div>
