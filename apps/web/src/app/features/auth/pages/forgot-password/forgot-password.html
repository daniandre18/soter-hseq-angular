<div class="forgot-password-page">
  <app-language-selector />
  <div class="login-brand">
    <div class="login-logo">S</div>
    <h1>SOTER HSEQ</h1>
  </div>

  <form class="forgot-password-card" (submit)="onSubmit(); $event.preventDefault()">
    <div class="login-card-header">
      <h2>{{ 'auth.forgot.title' | transloco }}</h2>

      @if (sent()) {
        <p class="success-message">
          {{ 'auth.forgot.success' | transloco }}
        </p>
      } @else {
        <p class="subtitle">{{ 'auth.forgot.subtitle' | transloco }}</p>
      }
    </div>

    @if (!sent()) {
      <label>
        {{ 'auth.login.email' | transloco }}
        <input type="email" [formField]="resetForm.email" autocomplete="username" />
        @if (resetForm.email().touched() && resetForm.email().errors().length) {
          <span class="field-error">{{ resetForm.email().errors()[0].message | transloco }}</span>
        }
      </label>

      @if (authError()) {
        <p class="form-error">{{ authError()! | transloco }}</p>
      }

      <button type="submit" [disabled]="resetForm().invalid() || loading()">
        {{ (loading() ? 'auth.forgot.sending' : 'auth.forgot.submit') | transloco }}
      </button>
    }

    <a routerLink="/login" class="back-link">{{ 'auth.forgot.back' | transloco }}</a>
  </form>
</div>
