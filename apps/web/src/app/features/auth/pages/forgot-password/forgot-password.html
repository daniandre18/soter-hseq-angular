<div class="forgot-password-page">
  <div class="login-brand">
    <div class="login-logo">S</div>
    <h1>SOTER HSEQ</h1>
  </div>

  <form class="forgot-password-card" (submit)="onSubmit(); $event.preventDefault()">
    <div class="login-card-header">
      <h2>Recuperar contraseña</h2>

      @if (sent()) {
        <p class="success-message">
          Si el correo existe, te enviamos un enlace para restablecer tu contraseña.
        </p>
      } @else {
        <p class="subtitle">Ingresa tu correo y te enviaremos instrucciones.</p>
      }
    </div>

    @if (!sent()) {
      <label>
        Correo
        <input type="email" [formField]="resetForm.email" autocomplete="username" />
        @if (resetForm.email().touched() && resetForm.email().errors().length) {
          <span class="field-error">{{ resetForm.email().errors()[0].message }}</span>
        }
      </label>

      @if (authError()) {
        <p class="form-error">{{ authError() }}</p>
      }

      <button type="submit" [disabled]="resetForm().invalid() || loading()">
        {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    }

    <a routerLink="/login" class="back-link">Volver a iniciar sesión</a>
  </form>
</div>
