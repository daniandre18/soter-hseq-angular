<app-modal [open]="open()" [title]="title() | transloco" size="md" (closeRequested)="close()">
  <form class="technician-form" (submit)="onSubmit(); $event.preventDefault()">
    @if (errorMessage()) {
      <p class="form-error field--full">{{ errorMessage() }}</p>
    }

    <label class="field field--full">
      {{ 'users.form.fullName' | transloco }} *
      <input [formField]="technicianForm.displayName" [placeholder]="'users.form.fullNamePlaceholder' | transloco" />
      @if (technicianForm.displayName().touched() && technicianForm.displayName().errors().length) {
        <span class="field-error">{{ technicianForm.displayName().errors()[0].message | transloco }}</span>
      }
    </label>

    @if (!editingTechnician()) {
      <label class="field">
        {{ 'users.form.email' | transloco }} *
        <input type="email" [formField]="technicianForm.email" placeholder="tecnico@soterhseq.demo" />
        @if (technicianForm.email().touched() && technicianForm.email().errors().length) {
          <span class="field-error">{{ technicianForm.email().errors()[0].message | transloco }}</span>
        }
      </label>

      <label class="field">
        {{ 'users.form.password' | transloco }} *
        <input type="password" [formField]="technicianForm.password" [placeholder]="'users.form.passwordPlaceholder' | transloco" />
        @if (technicianForm.password().touched() && technicianForm.password().errors().length) {
          <span class="field-error">{{ technicianForm.password().errors()[0].message | transloco }}</span>
        }
      </label>
    }

    <label class="field">
      {{ 'users.form.phone' | transloco }}
      <input type="tel" [formField]="technicianForm.phone" placeholder="+57 300 000 0000" />
    </label>

    <label class="field">
      {{ 'users.form.specialty' | transloco }}
      <input [formField]="technicianForm.specialty" [placeholder]="'users.form.specialtyPlaceholder' | transloco" />
    </label>
  </form>

  <div modalFooter>
    <app-button variant="outline" (click)="close()">{{ 'common.cancel' | transloco }}</app-button>
    <app-button (click)="onSubmit()" [disabled]="technicianForm().invalid() || saving()">
      {{ (saving() ? 'users.form.saving' : editingTechnician() ? 'users.form.saveChanges' : 'users.form.create') | transloco }}
    </app-button>
  </div>
</app-modal>
