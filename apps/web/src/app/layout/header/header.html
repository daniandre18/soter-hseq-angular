<header class="header">
  <div class="header-left">
    <button type="button" class="header-menu-btn" (click)="openMenu()" [attr.aria-label]="'layout.openMenu' | transloco">
      ☰
    </button>
    <h1 class="header-title">{{ title() | transloco }}</h1>
  </div>

  <div class="header-user">
    <!-- Ninguno de los dos depende de `currentUser()` (tema: localStorage;
         idioma: LanguageService) — sacarlos del `@if` evita que desaparezcan
         durante la ventana en que el perfil del usuario todavía está
         resolviendo, aunque el resto de la página (con datos de otras
         fuentes) ya esté completamente cargada. -->
    <app-theme-toggle />
    <app-language-selector />
    @if (currentUser(); as user) {
      @if (showNotifications()) {
        <app-notification-bell />
      }
      <app-avatar [name]="user.displayName" size="sm" tone="session" />
      <div class="header-user-info">
        <p class="header-user-name">{{ user.displayName }}</p>
        <p class="header-user-role">{{ roleTranslationKey() | transloco }}</p>
      </div>
    }
  </div>
</header>
