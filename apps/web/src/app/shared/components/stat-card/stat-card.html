<div class="stat-card" [class.stat-card--compact]="compact()">
  <div>
    <p class="stat-card-label">{{ label() }}</p>
    <p class="stat-card-value">
      {{ value() | localizedNumber }}
    </p>
  </div>
  <div class="stat-card-icon" [class]="'stat-card-icon--' + color()">
    <app-icon [name]="icon()" />
  </div>
</div>
